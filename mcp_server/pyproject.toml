[project]
name = "nexus-mcp-server"
version = "0.1.0"
description = "NEXUS MCP server: smart-home device tools over stdio (M4)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "nexus-backend",  # shared device models, validation and drivers (backend/)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["nexus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
